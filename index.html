<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
</head>
<body>
 <h1>Hello World</h1>

 <p id="parag1">This is my practical examination</p>

 <button id="btn1">alert Me</button>
 <button id="btn2">Change color</button>
 <script>
    const paragraph = document.getElementById("parag1");
    const button1 = document.querySelector("#btn1");
     const button2 = document.querySelector("#btn2");

     button1.addEventListener("click", function(){
        alert("Welcome to IT10");
     });
     button2.addEventListener("dbclick", function(){
       paragraph.style.color ="red";
     });

 </script>
</body>
</html>
